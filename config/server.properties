# Lumora defaults. Only keys that matter for Lumora are listed;
# Minecraft fills in the rest on first start.

# Players are verified by Lumora Auth through authlib-injector, so online mode stays ON.
online-mode=true
# Lumora does not issue Mojang chat-signing certificates.
enforce-secure-profile=false
prevent-proxy-connections=false

motd=§bLumora§r server
server-port=25565
max-players=20
view-distance=10
simulation-distance=10
white-list=false
